<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Register System</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<div class="bg-white p-8 rounded-lg shadow-lg w-96">

<h2 class="text-2xl font-bold mb-6 text-center" id="formTitle">Register</h2>

<form id="authForm">

<div class="mb-4" id="nameDiv">
<label class="block mb-1">Name</label>
<input type="text" id="name" class="w-full border p-2 rounded">
<p class="text-red-500 text-sm hidden" id="nameError"></p>
</div>

<div class="mb-4">
<label class="block mb-1">Email</label>
<input type="email" id="email" class="w-full border p-2 rounded">
<p class="text-red-500 text-sm hidden" id="emailError"></p>
</div>

<div class="mb-4">
<label class="block mb-1">Password</label>
<div class="relative">
<input type="password" id="password" class="w-full border p-2 rounded">
<button type="button" id="togglePassword" class="absolute right-2 top-2 text-gray-500">Show</button>
</div>
<p class="text-red-500 text-sm hidden" id="passwordError"></p>
</div>

<div class="mb-4" id="confirmDiv">
<label class="block mb-1">Confirm Password</label>
<input type="password" id="confirmPassword" class="w-full border p-2 rounded">
<p class="text-red-500 text-sm hidden" id="confirmError"></p>
</div>

<button class="bg-blue-500 text-white w-full py-2 rounded hover:bg-blue-600">
Submit
</button>

<p id="successMsg" class="text-green-600 text-center mt-4 hidden"></p>

<p class="text-sm mt-4 text-center">
<span id="toggleForm" class="text-blue-500 cursor-pointer">Already have an account? Login</span>
</p>

</form>

</div>

<script src="script.js"></script>
</body>
</html>
